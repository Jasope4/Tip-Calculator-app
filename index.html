<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Frontend Mentor | Tip calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- bill information section -->
      <div class="bill-info">
        <!-- bill input -->
        <div class="bill-input input-section">
          <p>Bill</p>

          <div class="input-container">
            <img src="images/icon-dollar.svg" alt="" />
            <input type="text" placeholder="0.00" />
          </div>
        </div>

        <!-- select tip -->
        <div class="tip-section">
          <p>Select Tip %</p>
          <div class="tip-buttons">
            <button class="tip-button">5%</button>
            <button class="tip-button">10%</button>
            <button class="tip-button third">15%</button>
            <button class="tip-button">25%</button>
            <button class="tip-button">50%</button>
            <button class="tip-button custom-tip-button">Custom</button>
          </div>
        </div>
        <!-- number of people -->
        <div class="number-of-people input-section">
          <p>Number of people</p>

          <div class="input-container">
            <img src="images/icon-person.svg" alt="" />
            <input type="text" placeholder="0" />
          </div>
        </div>
      </div>

      <!-- summary section -->
      <div class="summary">
        <!-- text under summary -->
        <div class="summary-price-container">
          <div class="summary-head">
            <div>
              <h2>Tip Amount</h2>
              <p class="slash">/ person</p>
            </div>

            <p class="price">$4.27</p>
          </div>
          <div class="summary-head">
            <div>
              <h2>Total</h2>
              <p class="slash">/ person</p>
            </div>

            <p class="price">$32.79</p>
          </div>
        </div>

        <!-- button -->
        <button class="summary-button">RESET</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
